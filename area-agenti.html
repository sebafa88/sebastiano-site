<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Area Agenti | Sebastiano Facco</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231b3f96'/%3E%3Cpath d='M18 18h28v8H26v8h16v8H26v8h-8z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --blue-900: #183989;
    --blue-800: #1b469f;
    --blue-700: #2461cf;
    --blue-100: #eaf1ff;
    --blue-50: #f5f8ff;
    --ink: #17213a;
    --muted: #64708a;
    --line: #dce4f3;
    --paper: #f6f8fc;
    --err: #c62b3b;
    --bar: 56px;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; }
  button { touch-action: manipulation; }

  /* ---------- Accesso ---------- */
  #gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .card {
    width: min(100%, 400px); background: #fff; border: 1px solid var(--line);
    border-radius: 22px; overflow: hidden; box-shadow: 0 16px 38px rgba(20,48,111,.09);
  }
  .card-top {
    position: relative; overflow: hidden; padding: 28px 28px 26px; color: #fff;
    background: linear-gradient(118deg, #17387f 0%, #275fc2 62%, #4b7add 100%);
  }
  .card-top:after {
    content: ""; position: absolute; width: 220px; height: 220px; right: -80px; top: -140px;
    border: 1px solid rgba(255,255,255,.18); border-radius: 50%;
    box-shadow: 0 0 0 36px rgba(255,255,255,.04), 0 0 0 72px rgba(255,255,255,.025);
  }
  .card-top > * { position: relative; z-index: 1; }
  .eyebrow { margin: 0 0 8px; font-size: .74rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: #dce8ff; }
  .card-top h1 { margin: 0 0 6px; font-size: 1.9rem; line-height: 1.05; letter-spacing: -.04em; }
  .lead { margin: 0; color: #dce8ff; font-size: .92rem; }
  .card-body { padding: 26px 28px 24px; }
  label { display: block; margin: 0 0 8px; font-size: .82rem; font-weight: 750; }
  input {
    width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px;
    background: #fff; color: var(--ink); font-size: 1rem; outline: 0;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: #7aa3f4; box-shadow: 0 0 0 4px rgba(37,99,209,.12); }
  .primary {
    width: 100%; margin-top: 14px; padding: 14px 16px; border: 0; border-radius: 14px;
    background: var(--blue-900); color: #fff; font-weight: 800; cursor: pointer; transition: background .2s;
  }
  .primary:hover { background: var(--blue-800); }
  .primary:focus-visible { outline: 3px solid #7aa3f4; outline-offset: 2px; }
  .primary:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 1.3em; margin: 12px 0 0; font-size: .85rem; font-weight: 700; color: var(--err); }
  .msg.info { color: var(--muted); font-weight: 600; }
  .note { margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: .78rem; line-height: 1.55; color: var(--muted); }

  /* ---------- Area riservata ---------- */
  #viewer { display: none; }
  body.in #gate { display: none; }
  body.in #viewer { display: block; }
  #bar {
    position: sticky; top: 0; z-index: 5; height: var(--bar);
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: #fff; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; white-space: nowrap; }
  .brand svg { width: 30px; height: 30px; flex: 0 0 30px; }
  .crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
  .crumb small { margin-left: 8px; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
    padding: 9px 14px; border-radius: 11px; font-size: .85rem; font-weight: 800;
    white-space: nowrap; cursor: pointer; transition: background .18s, color .18s, border-color .18s;
  }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.back { border: 0; background: var(--blue-50); color: var(--blue-900); }
  .btn.back:hover { background: var(--blue-100); }
  .btn.ghost { border: 1px solid var(--line); background: #fff; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); border-color: #c5d2ea; }
  .btn:focus-visible { outline: 3px solid #7aa3f4; outline-offset: 2px; }
  body.reading .brand { display: none; }

  #frame {
    display: block; width: 100%; border: 0; background: var(--paper);
    height: calc(100vh - var(--bar)); height: calc(100dvh - var(--bar));
  }
  /* Durante la lettura la dashboard resta viva sotto (filtri e scorrimento intatti al ritorno). */
  body.reading #frame { position: fixed; top: var(--bar); left: 0; visibility: hidden; pointer-events: none; }

  /* ---------- Lettura guida ---------- */
  #reader { display: none; min-height: calc(100vh - var(--bar)); padding: 20px 16px 40px; background: #eef2f8; }
  body.reading #reader { display: block; }
  .pages { display: grid; gap: 16px; max-width: 1180px; margin: 0 auto; }
  .pg {
    position: relative; margin: 0; overflow: hidden; background: #f3f6fb;
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 28px rgba(25,54,117,.08);
  }
  .pg.ok { background: #fff; }
  .pg img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .25s; }
  .pg.ok img { opacity: 1; }
  .pg .ph { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: grid; place-items: center; color: #8a95ab; font-size: .85rem; font-weight: 700; }
  .pg.ok .ph { display: none; }
  .pg.err { cursor: pointer; }
  .pg a.lnk { position: absolute; border-radius: 8px; }
  .pg a.lnk:hover, .pg a.lnk:focus-visible { background: rgba(36,97,207,.10); outline: 2px solid var(--blue-700); }
  .r-foot { display: flex; justify-content: center; max-width: 1180px; margin: 22px auto 0; }

  @media (max-width: 760px) {
    #bar { gap: 10px; padding: 0 12px; }
    .btn { padding: 8px 12px; }
    .crumb small { display: none; }
    #reader { padding: 12px 10px 32px; }
    .pages { gap: 10px; }
    .pg { border-radius: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main id="gate">
  <form class="card" id="form" autocomplete="off">
    <div class="card-top">
      <p class="eyebrow">Supporto agenti</p>
      <h1>Area Agenti</h1>
      <p class="lead">Procedure e guide di lavoro</p>
    </div>
    <div class="card-body">
      <label for="pwd">Password di accesso</label>
      <input type="password" id="pwd" autocomplete="current-password" autofocus>
      <button type="submit" class="primary" id="go">Accedi</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <p class="note">I contenuti di quest'area sono cifrati: senza la password corretta
        non sono leggibili in alcun modo, nemmeno dal codice sorgente.</p>
    </div>
  </form>
</main>

<div id="viewer">
  <header id="bar">
    <button type="button" class="btn back" id="back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Dashboard
    </button>
    <span class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1b3f96"/><path d="M18 18h28v8H26v8h16v8H26v8h-8z" fill="#fff"/></svg>
      Area Agenti
    </span>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <button type="button" class="btn ghost" id="out">Esci</button>
  </header>
  <iframe id="frame" title="Dashboard area agenti"></iframe>
  <main id="reader">
    <div class="pages" id="pages"></div>
    <div class="r-foot">
      <button type="button" class="btn back" id="back2">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Torna alla dashboard
      </button>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const dec = new TextDecoder();
  const TITLE = document.title;
  let key = null, manifest = null, kdf = null;

  // Guida aperta: ogni apertura ha un numero, così i caricamenti di una guida già chiusa si fermano.
  let run = 0, open = null, observer = null, urls = [], ctrl = null;

  const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(kdf.salt), iterations: kdf.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  // I file del vault prendono il nome dal contenuto: possono stare in cache. Il manifest no.
  async function fetchDecrypt(id, fresh, signal) {
    const res = await fetch(`vault/${id}.bin`, { cache: fresh ? 'no-store' : 'default', signal });
    if (!res.ok) throw new Error('risorsa non disponibile');
    const raw = new Uint8Array(await res.arrayBuffer());
    // layout: [iv 12][tag 16][ciphertext]
    const iv = raw.subarray(0, 12);
    const body = new Uint8Array(raw.length - 12);
    body.set(raw.subarray(28), 0);                 // ciphertext
    body.set(raw.subarray(12, 28), raw.length - 28); // tag in coda (WebCrypto)
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, body);
  }

  // ---------- Dashboard ----------
  async function loadDashboard() {
    const html = dec.decode(await fetchDecrypt(manifest.pages['dashboard.html']));
    const frame = $('frame');
    frame.onload = () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      const onLink = (e) => {
        const a = e.target.closest ? e.target.closest('a') : null;
        if (!a) return;
        const href = (a.getAttribute('href') || '').replace(/^\.\//, '');
        if (!href || href.startsWith('#')) return;
        if (e.type === 'auxclick') {                   // clic con la rotella: niente schede rotte
          if (manifest.guides[href]) e.preventDefault();
          return;
        }
        e.preventDefault();
        if (manifest.guides[href]) openGuide(href, a.dataset.title || a.textContent.trim(), true);
        else if (/^https?:/i.test(href)) window.open(href, '_blank', 'noopener');
        else if (/^(mailto:|tel:)/i.test(href)) location.href = href;
        else if (href === 'index.html') location.href = 'index.html';
      };
      doc.addEventListener('click', onLink);
      doc.addEventListener('auxclick', onLink);
    };
    frame.srcdoc = html;
  }

  function showDashboard() {
    closeGuide();
    document.body.classList.remove('reading');
    $('back').hidden = true;
    $('crumb').textContent = '';
    document.title = TITLE;
    window.scrollTo(0, 0);
  }

  // ---------- Guida ----------
  function openGuide(href, title, push) {
    const guide = manifest.guides[href];
    if (!guide) { showDashboard(); return; }
    if (push) history.pushState({ guide: href, title }, '');
    closeGuide();
    const mine = run;
    const n = guide.pages.length;
    open = { guide, run: mine };
    ctrl = 'AbortController' in window ? new AbortController() : null;

    document.body.classList.add('reading');
    $('back').hidden = false;
    $('crumb').innerHTML = '';
    $('crumb').append(title);
    const meta = document.createElement('small');
    meta.textContent = n === 1 ? '1 pagina' : `${n} pagine`;
    $('crumb').append(meta);
    document.title = `${title} · Area Agenti`;
    window.scrollTo(0, 0);

    observer = 'IntersectionObserver' in window
      ? new IntersectionObserver(onSeen, { rootMargin: '1200px 0px' }) : null;
    const list = $('pages');
    guide.pages.forEach((p, i) => {
      const fig = document.createElement('figure');
      fig.className = 'pg';
      fig.dataset.i = i;
      const ratio = document.createElement('div');
      ratio.style.paddingTop = `${(p.h / p.w * 100).toFixed(3)}%`;
      const ph = document.createElement('span');
      ph.className = 'ph';
      ph.textContent = `Pagina ${i + 1}`;
      const img = document.createElement('img');
      img.alt = `${title}, pagina ${i + 1} di ${n}`;
      img.width = p.w; img.height = p.h;
      img.decoding = 'async';
      fig.append(ratio, ph, img);
      for (const l of p.links || []) {
        const a = document.createElement('a');
        a.className = 'lnk';
        a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
        a.title = l.url;
        a.style.left = `${l.x}%`; a.style.top = `${l.y}%`;
        a.style.width = `${l.w}%`; a.style.height = `${l.h}%`;
        fig.append(a);
      }
      list.append(fig);
      if (observer) observer.observe(fig); else enqueue(fig, p, mine);
    });
  }

  function onSeen(entries) {
    for (const e of entries) {
      if (!e.isIntersecting || !open) continue;
      observer.unobserve(e.target);
      enqueue(e.target, open.guide.pages[+e.target.dataset.i], open.run);
    }
  }

  // Pagine in ordine: la prima da sola (con poco segnale arriva subito), poi tre alla volta.
  let queue = [], active = 0, firstDone = false, scheduled = false;
  function enqueue(fig, p, mine) {
    queue.push({ fig, p, mine, i: +fig.dataset.i });
    if (scheduled) return;
    scheduled = true;
    Promise.resolve().then(() => {        // prima raccoglie tutte le pagine visibili, poi parte
      scheduled = false;
      pump();
    });
  }
  function pump() {
    queue.sort((a, b) => a.i - b.i);
    while (active < (firstDone ? 3 : 1) && queue.length) {
      const job = queue.shift();
      if (job.mine !== run) continue;
      active++;
      loadPage(job.fig, job.p, job.mine).finally(() => {
        if (job.mine !== run) return;   // guida già chiusa: i suoi conti non valgono più
        firstDone = true;
        active--;
        pump();
      });
    }
  }

  async function loadPage(fig, p, mine) {
    const ph = fig.querySelector('.ph');
    try {
      const buf = await fetchDecrypt(p.id, false, ctrl && ctrl.signal);
      if (mine !== run) return;
      const url = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
      urls.push(url);
      const img = fig.querySelector('img');
      img.onload = () => fig.classList.add('ok');
      img.src = url;
    } catch (err) {
      if (mine !== run) return;
      fig.classList.add('err');
      ph.textContent = 'Pagina non caricata · tocca per riprovare';
      fig.onclick = () => {
        fig.onclick = null;
        fig.classList.remove('err');
        ph.textContent = `Pagina ${+fig.dataset.i + 1}`;
        loadPage(fig, p, mine);
      };
    }
  }

  function closeGuide() {
    run++;
    open = null;
    queue = []; active = 0; firstDone = false;
    if (ctrl) { ctrl.abort(); ctrl = null; }   // ferma i download della guida chiusa
    if (observer) { observer.disconnect(); observer = null; }
    for (const u of urls) URL.revokeObjectURL(u);
    urls = [];
    $('pages').textContent = '';
  }

  function toDashboard() {
    if (history.state && history.state.guide) history.back();   // come il tasto indietro
    else showDashboard();
  }

  window.addEventListener('popstate', (e) => {
    if (!manifest) return;
    const s = e.state;
    if (s && s.guide && manifest.guides[s.guide]) openGuide(s.guide, s.title, false);
    else showDashboard();
  });

  // ---------- Accesso ----------
  const kdfReady = fetch('vault/kdf.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(j => { kdf = j; });

  async function unlock(password) {
    await kdfReady;
    key = await deriveKey(password);
    const buf = await fetchDecrypt('manifest', true); // fallisce se la password è errata
    manifest = JSON.parse(dec.decode(buf));
    manifest.guides = manifest.guides || {};
    sessionStorage.removeItem('sf_page');               // chiave della vecchia dashboard
    document.body.classList.add('in');
    await loadDashboard();
    const s = history.state;
    if (s && s.guide && manifest.guides[s.guide]) openGuide(s.guide, s.title, false);
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('msg'), btn = $('go');
    msg.className = 'msg info'; msg.textContent = 'Verifica in corso…';
    btn.disabled = true;
    try {
      const pwd = $('pwd').value;
      await unlock(pwd);
      sessionStorage.setItem('sf_k', pwd);
      msg.textContent = '';
    } catch (err) {
      document.body.classList.remove('in');
      manifest = null;
      msg.className = 'msg';
      msg.textContent = err && err.name === 'OperationError'
        ? 'Password errata.'
        : 'Area non raggiungibile. Controlla la connessione e riprova.';
      $('pwd').value = ''; $('pwd').focus();
    } finally {
      btn.disabled = false;
    }
  });

  $('back').addEventListener('click', toDashboard);
  $('back2').addEventListener('click', toDashboard);
  $('out').addEventListener('click', () => {
    sessionStorage.removeItem('sf_k');
    sessionStorage.removeItem('sf_page');
    closeGuide();
    history.replaceState(null, '');
    location.reload();
  });

  // Avvio: riapre la sessione se già sbloccata in questa scheda.
  const saved = sessionStorage.getItem('sf_k');
  if (saved) {
    const msg = $('msg');
    msg.className = 'msg info'; msg.textContent = 'Apertura in corso…';
    unlock(saved).then(() => { msg.textContent = ''; }, () => {
      sessionStorage.removeItem('sf_k');
      document.body.classList.remove('in');
      manifest = null;
      msg.textContent = '';
    });
  }
})();
</script>
</body>
</html>
